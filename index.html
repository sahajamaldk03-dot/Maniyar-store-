<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANIYAR STORE</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>MANIYAR STORE</h1>

<nav>
<a href="#">Home</a>
<a href="#men">Men</a>
<a href="#kids">Kids</a>
<a href="#contact">Contact</a>
</nav>

</header>

<section class="hero">
<h2>Complete Family Fashion (Men & Kids)</h2>
<p>Latest Collection • Best Price</p>

<a class="btn" href="https://wa.me/918779716804">
Order on WhatsApp
</a>

</section>

<section id="men">
<h2>Men's Wear</h2>

<div id="products"></div>

</section>

<section id="kids">
<h2>Kids Wear</h2>

<div id="kids-container"></div>

</section>

<footer id="contact">

<p>
222, I.R. Road,
Bhendi Bazaar,
Mumbai - 400003
</p>

<p>
WhatsApp :
8779716804
</p>

</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

apiKey:"AIzaSyCVk2JzJ-NjhgGA9NVTjegFn3PsLFvOEFU",

authDomain:"maniyarstore-952f8.firebaseapp.com",

projectId:"maniyarstore-952f8",

storageBucket:"maniyarstore-952f8.firebasestorage.app",

messagingSenderId:"799276754088",

appId:"1:799276754088:web:0791b421d01028d1908e9d"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const men = document.getElementById("products");

const kids = document.getElementById("kids-container");

const snapshot = await getDocs(collection(db,"products"));

snapshot.forEach((doc)=>{

const p = doc.data();

const card = `

<div class="product-card">

<img src="${p.image}" width="180">

<h3>${p.name}</h3>

<p><del>₹${p.brandPrice}</del></p>

<h2>₹${p.price}</h2>

</div>

`;

if(p.category=="men"){

men.innerHTML+=card;

}

if(p.category=="kids"){

kids.innerHTML+=card;

}

});

</script>

</body>
</html>
